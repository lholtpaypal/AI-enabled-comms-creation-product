[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oslo-comms-studio"
version = "0.1.0"
description = "Localhost demo for AI-native communications creation."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "requests>=2.32,<3",
]

[project.scripts]
oslo-comms-demo = "oslo_comms_studio.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oslo_comms_studio"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
